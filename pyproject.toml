[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-two-tower-recsys"
version = "0.1.0"
description = "A two-tower recommender that trains and benchmarks on AMD ROCm GPUs (device-agnostic PyTorch)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
